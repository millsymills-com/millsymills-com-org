name: gitleaks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # gitleaks-action v2.x requires a paid license for organization repos.
      # Run the upstream gitleaks binary directly (Apache-2.0, free). Version
      # mirrors the pre-commit hook in .pre-commit-config.yaml for parity.
      - name: Install gitleaks
        env:
          GL_VER: 8.21.2
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VER}/gitleaks_${GL_VER}_linux_x64.tar.gz" \
            | tar -xz -C "${RUNNER_TEMP}" gitleaks
          chmod +x "${RUNNER_TEMP}/gitleaks"
          "${RUNNER_TEMP}/gitleaks" version

      - name: Run gitleaks
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/gitleaks" git --no-banner --redact --verbose --exit-code 1
