name: tofu-apply

on:
  push:
    branches: [main]
    paths:
      - "**/*.tf"
      - ".github/workflows/tofu-*.yml"
      - "modules/**"
      - "repos_*.tf"
      - "org.tf"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# No ref key. All apply runs target main, so serialization should be global.
concurrency:
  group: tofu-apply
  cancel-in-progress: false

jobs:
  apply:
    name: apply
    runs-on: ubuntu-24.04
    environment: tofu-apply
    timeout-minutes: 30

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            registry.opentofu.org:443
            get.opentofu.org:443
            release-assets.githubusercontent.com:443
            sts.amazonaws.com:443
            sts.us-west-1.amazonaws.com:443
            s3.us-west-1.amazonaws.com:443
            tfstate-millsymills-025507317036.s3.us-west-1.amazonaws.com:443
            secretsmanager.us-west-1.amazonaws.com:443
            kms.us-west-1.amazonaws.com:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.10.3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: arn:aws:iam::025507317036:role/gha-millsymills-org-tofu-apply
          aws-region: us-west-1

      - name: Fetch writer App key to a tempfile
        run: |
          set -euo pipefail
          PEM_FILE="${RUNNER_TEMP}/writer-app.pem"
          umask 077
          aws secretsmanager get-secret-value \
            --secret-id github-app-key/millsymills-org-bot-writer \
            --query SecretString --output text > "${PEM_FILE}"
          chmod 600 "${PEM_FILE}"
          echo "TF_VAR_github_app_pem_file=${PEM_FILE}" >> "${GITHUB_ENV}"

      - name: tofu init
        run: tofu init -input=false

      - name: tofu plan
        env:
          TF_VAR_github_app_id: ${{ vars.WRITER_APP_ID }}
          TF_VAR_github_app_installation_id: ${{ vars.WRITER_INSTALLATION_ID }}
        run: tofu plan -no-color -lock-timeout=120s -out=tfplan

      - name: tofu apply
        env:
          TF_VAR_github_app_id: ${{ vars.WRITER_APP_ID }}
          TF_VAR_github_app_installation_id: ${{ vars.WRITER_INSTALLATION_ID }}
        run: tofu apply -no-color -lock-timeout=120s -auto-approve tfplan

      - name: Cleanup tfplan and pem
        if: always()
        run: |
          rm -f tfplan "${RUNNER_TEMP}/writer-app.pem"
