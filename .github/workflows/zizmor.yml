name: zizmor

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No paths filter: required check for the management repo, must report on every PR.
permissions:
  contents: read
  security-events: write

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          inputs: ".github/workflows/"
          # GHAS is not enabled on this repo (Free plan). Without this,
          # zizmor-action uploads SARIF, which surfaces as a second
          # `zizmor` check-run owned by github-advanced-security that
          # stays queued forever and deadlocks the required-check ruleset.
          advanced-security: false
