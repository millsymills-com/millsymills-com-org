name: zizmor

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No paths filter: required check for the management repo, must report on every PR.
permissions:
  contents: read
  security-events: write

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@5f14fd08f7cf1cb1609c1e344975f152c7ee938d # v0.5.6
        with:
          inputs: ".github/workflows/"
          # GHAS is not enabled on this repo (Free plan). Without this,
          # zizmor-action uploads SARIF, which surfaces as a second
          # `zizmor` check-run owned by github-advanced-security that
          # stays queued forever and deadlocks the required-check ruleset.
          advanced-security: false
