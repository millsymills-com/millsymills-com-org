name: zizmor

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No paths filter: required check for the management repo, must report on every PR.
permissions:
  contents: read
  security-events: write

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa # v0.5.7
        with:
          inputs: ".github/workflows/"
          # GHAS is not enabled on this repo (Free plan). Without this,
          # zizmor-action uploads SARIF, which surfaces as a second
          # `zizmor` check-run owned by github-advanced-security that
          # stays queued forever and deadlocks the required-check ruleset.
          advanced-security: false
