name: zizmor

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No paths filter: required check for the management repo, must report on every PR.
permissions:
  contents: read
  security-events: write

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@a16621b09c6db4281f81a93cb393b05dcd7b7165 # v0.5.5
        with:
          inputs: ".github/workflows/"
          # GHAS is not enabled on this repo (Free plan). Without this,
          # zizmor-action uploads SARIF, which surfaces as a second
          # `zizmor` check-run owned by github-advanced-security that
          # stays queued forever and deadlocks the required-check ruleset.
          advanced-security: false
